# WiamOX build of Arch's coreutils (read by scripts/build.sh).

# WiamOX release on top of Arch's: Arch 9.12-2 + WIAMOX_PKGREL=1 -> 9.12-2.1.
# Raise it when you change patches/ while Arch's version stays the same;
# set it back to 1 when Arch's version changes.
WIAMOX_PKGREL=1

# Folder the patches are applied in. Arch builds coreutils from a git
# checkout in $srcdir/coreutils (the tarball is only used for translations).
# makepkg expands the variables.
WIAMOX_SRC_DIR='$pkgname'
